# ============================================================
# CI/CD Pipeline — Medusa Automation Framework
# Selenium 4 + TestNG + REST Assured + Newman + Allure 2.28
# ============================================================
#
# Trigger:
#   - Push vào main
#   - Pull Request vào main
#   - Chạy thủ công (workflow_dispatch)
#
# Output:
#   - Allure Report deploy lên GitHub Pages
#   - Screenshots + Surefire reports lưu làm CI Artifacts

name: Automation Tests & Allure Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run (all / api / ui / storefront)'
        required: false
        default: 'all'

# Chỉ cần 1 job — chạy tuần tự để tránh race condition trên allure-results
jobs:
  test-and-report:
    name: Run Tests & Deploy Allure Report
    runs-on: ubuntu-latest

    # Cấp quyền write cho GitHub Pages và contents
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      # ----------------------------------------------------------
      # STEP 1: Checkout source code
      # ----------------------------------------------------------
      # Checkout toàn bộ repo — bao gồm cả postman_collection.json ở root
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # STEP 2: Setup JDK 11
      # ----------------------------------------------------------
      # Dùng đúng version Java 11 như khai báo trong pom.xml
      # temurin = Eclipse Adoptium (phổ biến nhất cho CI)
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven   # Cache ~/.m2 để lần sau build nhanh hơn

      # ----------------------------------------------------------
      # STEP 3: Setup Node.js (cho Newman)
      # ----------------------------------------------------------
      # Node.js LTS 20 — dùng để chạy Newman (Postman CLI runner)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ----------------------------------------------------------
      # STEP 4: Cài Chrome (headed mode không dùng nhưng cần binary)
      # ----------------------------------------------------------
      # ubuntu-latest đã có Chrome; bước này đảm bảo version ổn định
      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | \
            gpg --batch --yes --dearmor | \
            sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] \
            http://dl.google.com/linux/chrome/deb/ stable main" | \
            sudo tee /etc/apt/sources.list.d/google-chrome.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      # ----------------------------------------------------------
      # STEP 5: Generate config/test.properties từ GitHub Secrets
      # ----------------------------------------------------------
      # ConfigReader đọc env vars TRƯỚC file — step này tạo file
      # để dự phòng và cũng để có đủ cả properties không map qua env var.
      # LƯU Ý: Credentials được inject qua secrets — KHÔNG in ra log.
      - name: Generate config/test.properties from Secrets
        run: |
          mkdir -p config
          cat > config/test.properties << EOF
          # Auto-generated by CI — DO NOT COMMIT
          base.url=${{ secrets.BASE_URL }}
          storefront.url=${{ secrets.STOREFRONT_URL }}
          storefront.base.path=/gb
          admin.email=${{ secrets.ADMIN_EMAIL }}
          admin.password=${{ secrets.ADMIN_PASSWORD }}
          storefront.customer.email=${{ secrets.CUSTOMER_EMAIL }}
          storefront.customer.password=${{ secrets.CUSTOMER_PASSWORD }}
          browser=chrome
          headless=true
          implicit.wait=0
          explicit.wait=20
          page.load.timeout=45
          screenshot.on.fail=true
          screenshot.dir=target/screenshots
          api.base.url=${{ secrets.BASE_URL }}
          api.publishable.key=${{ secrets.API_PUBLISHABLE_KEY }}
          api.timeout.ms=15000
          EOF
          echo "config/test.properties generated (credentials hidden)"

      # ----------------------------------------------------------
      # STEP 6: Build project (compile only — no tests)
      # ----------------------------------------------------------
      # Verify project biên dịch thành công trước khi chạy tests
      - name: Build (compile)
        run: mvn compile test-compile -B -q

      # ----------------------------------------------------------
      # STEP 7: Run API Tests (testng-api.xml)
      # ----------------------------------------------------------
      # REST Assured — không cần browser, chạy nhanh nhất
      # continue-on-error: true → dù có test FAIL vẫn chạy tiếp
      - name: Run API Tests (REST Assured)
        continue-on-error: true
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
          API_BASE_URL: ${{ secrets.BASE_URL }}
          API_PUBLISHABLE_KEY: ${{ secrets.API_PUBLISHABLE_KEY }}
        run: |
          echo "Starting REST Assured API Tests..."
          mvn test -B -DsuiteFile=testng-api.xml \
            -Dallure.results.directory=target/allure-results \
            || echo "Some API tests failed — continuing to next suite"

      # ----------------------------------------------------------
      # STEP 8: Run Admin UI Tests (testng.xml — Selenium)
      # ----------------------------------------------------------
      # Chrome headless — CI=true được set để DriverFactory tự kích hoạt headless
      - name: Run Admin UI Tests (Selenium)
        continue-on-error: true
        env:
          CI: true
          DISPLAY: ':99'
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
          API_BASE_URL: ${{ secrets.BASE_URL }}
          API_PUBLISHABLE_KEY: ${{ secrets.API_PUBLISHABLE_KEY }}
          STOREFRONT_URL: ${{ secrets.STOREFRONT_URL }}
        run: |
          echo "Starting Selenium Admin UI Tests..."
          mvn test -B -DsuiteFile=testng.xml \
            -Dallure.results.directory=target/allure-results \
            || echo "Some Admin UI tests failed — continuing to next suite"

      # ----------------------------------------------------------
      # STEP 9: Run Storefront UI Tests (testng-storefront.xml)
      # ----------------------------------------------------------
      - name: Run Storefront UI Tests (Selenium)
        continue-on-error: true
        env:
          CI: true
          DISPLAY: ':99'
          BASE_URL: ${{ secrets.BASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
          API_BASE_URL: ${{ secrets.BASE_URL }}
          API_PUBLISHABLE_KEY: ${{ secrets.API_PUBLISHABLE_KEY }}
          STOREFRONT_URL: ${{ secrets.STOREFRONT_URL }}
        run: |
          echo "Starting Selenium Storefront UI Tests..."
          mvn test -B -DsuiteFile=testng-storefront.xml \
            -Dallure.results.directory=target/allure-results \
            || echo "Some Storefront tests failed — continuing"

      # ----------------------------------------------------------
      # STEP 10: Install Newman + Allure reporter
      # ----------------------------------------------------------
      # newman-reporter-allure: xuất kết quả Newman thẳng vào
      # thư mục allure-results để gộp chung vào report tổng hợp
      - name: Install Newman & Allure reporter
        run: |
          npm install -g newman newman-reporter-allure
          newman --version

      # ----------------------------------------------------------
      # STEP 11: Tạo Postman environment file cho Newman
      # ----------------------------------------------------------
      # Postman collection dùng {{base_url}} và {{publishable_key}}
      # → Newman cần environment file để inject giá trị này
      - name: Generate Newman environment file
        run: |
          cat > newman-environment.json << EOF
          {
            "id": "ci-environment",
            "name": "CI Environment",
            "values": [
              {
                "key": "base_url",
                "value": "${{ secrets.BASE_URL }}",
                "enabled": true
              },
              {
                "key": "publishable_key",
                "value": "${{ secrets.API_PUBLISHABLE_KEY }}",
                "enabled": true
              },
              {
                "key": "customer_email",
                "value": "${{ secrets.CUSTOMER_EMAIL }}",
                "enabled": true
              },
              {
                "key": "customer_password",
                "value": "${{ secrets.CUSTOMER_PASSWORD }}",
                "enabled": true
              }
            ]
          }
          EOF
          echo "Newman environment file generated"

      # ----------------------------------------------------------
      # STEP 12: Run Newman (Postman collection)
      # ----------------------------------------------------------
      # Dùng --reporter allure để ghi kết quả vào thư mục
      # allure-results của Maven project — gộp chung vào report
      - name: Run Newman (Postman Collection)
        continue-on-error: true
        run: |
          echo "Starting Newman Postman Tests..."
          newman run postman_collection.json \
            --environment newman-environment.json \
            --reporters cli,allure \
            --reporter-allure-export target/allure-results \
            --timeout-request 30000 \
            --timeout-script 10000 \
            || echo "Some Newman tests failed — continuing to generate report"

      # ----------------------------------------------------------
      # STEP 13: Install Allure CLI
      # ----------------------------------------------------------
      # Cài Allure commandline để generate HTML report
      # Dùng scoop-compatible install trên Ubuntu
      - name: Install Allure CLI
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.28.0/allure-2.28.0.tgz
          tar -xzf allure-2.28.0.tgz
          sudo mv allure-2.28.0 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure
          allure --version

      # ----------------------------------------------------------
      # STEP 14: Generate Allure HTML Report
      # ----------------------------------------------------------
      # allure-results chứa JSON từ REST Assured + Selenium + Newman
      # → generate thành HTML report đẹp tổng hợp
      - name: Generate Allure Report
        run: |
          echo "Generating consolidated Allure Report..."
          allure generate target/allure-results \
            --clean \
            -o allure-report
          echo "Report generated at: allure-report/"
          ls -la allure-report/

      # ----------------------------------------------------------
      # STEP 15: Upload Allure Results & Report as CI Artifacts
      # ----------------------------------------------------------
      # Lưu artifacts 14 ngày — download được từ GitHub Actions UI
      - name: Upload Allure Results (raw JSON)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ github.run_number }}
          path: target/allure-results/
          retention-days: 14

      - name: Upload Allure HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 14

      - name: Upload Screenshots on Failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_number }}
          path: target/screenshots/
          retention-days: 14

      - name: Upload Surefire Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports-${{ github.run_number }}
          path: target/surefire-reports/
          retention-days: 14

      # ----------------------------------------------------------
      # STEP 16: Deploy Allure Report → GitHub Pages (gh-pages)
      # ----------------------------------------------------------
      # Chỉ deploy khi push vào main (không deploy khi PR)
      # peaceiris/actions-gh-pages: push thư mục allure-report/
      # lên nhánh gh-pages → GitHub Pages serve thành website public
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          commit_message: |
            deploy: Allure Report #${{ github.run_number }} [${{ github.sha }}]
          force_orphan: false

      # ----------------------------------------------------------
      # STEP 17: Summary — In kết quả tổng hợp vào GitHub Actions log
      # ----------------------------------------------------------
      - name: Job Summary
        if: always()
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | File |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| API Tests (REST Assured) | testng-api.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| Admin UI Tests (Selenium) | testng.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| Storefront Tests (Selenium) | testng-storefront.xml |" >> $GITHUB_STEP_SUMMARY
          echo "| Newman (Postman) | postman_collection.json |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Allure Report:** [GitHub Pages](https://github.com/${{ github.repository }}/deployments)" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }} | Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
